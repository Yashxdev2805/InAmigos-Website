version: '3.8'

services:
  # InAmigos Express REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://inamigos_user:inamigos_secure_pass123@db:5432/inamigos_db?schema=public
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=inamigos_jwt_super_secret_2026
      - RAZORPAY_WEBHOOK_SECRET=demo_razorpay_secret_987
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: always

  # Production PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: inamigos_postgres
    environment:
      POSTGRES_USER: inamigos_user
      POSTGRES_PASSWORD: inamigos_secure_pass123
      POSTGRES_DB: inamigos_db
    ports:
      - "127.0.0.1:5432:5432" # Bound strictly to localhost (Closed to public internet)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inamigos_user -d inamigos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Redis 7 Caching & Rate Limiting Service
  cache:
    image: redis:7-alpine
    container_name: inamigos_redis
    ports:
      - "127.0.0.1:6379:6379" # Bound strictly to localhost
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
