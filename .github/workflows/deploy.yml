name: InAmigos Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build Backend REST API
        run: |
          cd backend
          npm ci
          npm run build

      - name: Install & Build Frontend Web App
        run: |
          cd inamigos-foundation
          npm ci
          npm run build

      - name: Security Scan (SAST Audit)
        run: |
          cd backend
          npm audit --audit-level=high || true
